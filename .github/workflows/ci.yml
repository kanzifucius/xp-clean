name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required branch-protection status check context is this job name: "test"
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: golangci-lint
        # v6 resolves "latest" to golangci-lint v1, which is built with Go <1.26.
        # v8+ installs golangci-lint v2 (matches .golangci.yml version: "2").
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
