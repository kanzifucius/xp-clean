name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required branch-protection status check context is this job name: "test"
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: golangci-lint
        # v6 resolves "latest" to golangci-lint v1, which is built with Go <1.26.
        # v8+ installs golangci-lint v2 (matches .golangci.yml version: "2").
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: make helm-lint

      - name: Template chart
        run: make helm-template

      - name: Package chart (smoke, no push)
        run: HELM_VERSION=v0.0.0-ci make helm-package
