name: Feature request
description: Suggest an enhancement for xp-clean
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behaviour you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already tried.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Note: LegacyCluster claims are out of scope. Prefer ConfigMap / file policy
        shapes that match existing samples under `config/samples/`.
