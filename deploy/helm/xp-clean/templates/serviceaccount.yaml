{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "xp-clean.serviceAccountName" . }}
  namespace: {{ include "xp-clean.namespace" . }}
  labels:
    {{- include "xp-clean.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
