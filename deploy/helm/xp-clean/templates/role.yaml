{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "xp-clean.fullname" . }}-policy
  namespace: {{ include "xp-clean.namespace" . }}
  labels:
    {{- include "xp-clean.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
{{- end }}
