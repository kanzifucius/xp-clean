# Default install targets the dedicated xp-clean namespace (locked preference).
namespace:
  # Create a Namespace manifest. Set false when the namespace already exists
  # and you install with --namespace xp-clean --create-namespace.
  create: true
  name: xp-clean

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/kanzifucius/xp-clean
  # Pin an immutable SemVer tag in clusters (prefer :vX.Y.Z).
  # Release packaging rewrites this from the git tag (keeps leading v).
  tag: "v0.1.0-rc.1"
  pullPolicy: IfNotPresent

# Default image package is public (anonymous pull). For private forks, supply a
# docker-registry secret with read:packages and set image.repository as needed.
imagePullSecrets: []
# - name: ghcr-xp-clean

serviceAccount:
  create: true
  name: xp-clean
  annotations: {}

rbac:
  create: true

# When true (default), CronJob/manager stay on the dry-run plan path.
# Live deletes need dryRun: false here (passes --apply) AND policy dryRun: false.
dryRun: true

# CronJob is the default install path (xp-clean run --once).
cronjob:
  enabled: true
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  # Extra args appended after `run --once` (and optional --apply).
  extraArgs: []
  # - --fail-on-blocked

# Optional long-running manager (interval stub). Off by default — CronJob is preferred.
manager:
  enabled: false
  replicas: 1
  extraArgs: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Sample labelled policy ConfigMap (xp-clean.io/policy=true). Day-1 essentials only.
# Advanced globs / notify / budgets / scope: all — see docs Concepts → Policy (Advanced).
policy:
  create: true
  name: xp-clean-policy-sample
  # Inline document under data.policy.yaml. dryRun here should stay true until you are ready.
  document: |
    name: sample
    dryRun: true
    selectors:
      requireLabels:
        xp-clean.io/eligible: "true"
    ttl:
      respectResourceTTL: true
      defaultTTL: 168h
    deletion:
      mode: roots
      scope: instances-only


# Optional env (for example Teams webhook Secret refs). Empty by default.
env: []
# - name: XP_CLEAN_TEAMS_WEBHOOK_URL
#   valueFrom:
#     secretKeyRef:
#       name: xp-clean-notify
#       key: webhook-url

nodeSelector: {}
tolerations: []
affinity: {}
