# Xp-clean documentation site (Material for MkDocs + mike versioning).
site_name: Xp-clean
site_description: Scheduled discovery and cleanup of Crossplane composition trees.
site_url: https://kanzifucius.github.io/xp-clean/
site_author: Xp-clean maintainers
repo_url: https://github.com/kanzifucius/xp-clean
repo_name: kanzifucius/xp-clean
edit_uri: edit/main/docs/
copyright: Copyright &copy; Xp-clean contributors

# Trailing slash required for mike version switching (Material docs).
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    # Follow OS preference first, then explicit light / slate.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  font:
    # Expressive but calm — avoid Inter / Roboto / system defaults.
    text: Sora
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github
    logo: material/broom

extra_css:
  - stylesheets/extra.css

plugins:
  # Re-declared because other plugins are listed; Material search is client-side (lunr).
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - mike:
      # Symlink aliases (latest → 0.1.0); falls back to copy on platforms without symlink support.
      alias_type: symlink
      canonical_version: latest
      version_selector: true

extra:
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kanzifucius/xp-clean

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install:
    - Overview: install.md
    - Quickstart: quickstart.md
  - Concepts:
    - concepts/index.md
    - Policy and eligibility: concepts/policy.md
  - Architecture:
    - architecture/index.md
    - Runtime diagram: architecture/runtime.md
    - Cleanup workflow: architecture/workflow.md
    - Teams sequence: architecture/sequence.md
  - CLI: cli.md
  - Operations:
    - operations/index.md
    - Cleanup: operations/cleanup.md
    - Notifications: operations/notifications.md
  - Contributing: contributing.md
