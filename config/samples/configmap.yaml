# Primary in-cluster policy surface for team A (day-1 essentials).
# Install into the dedicated xp-clean namespace (Helm default).
# Label xp-clean.io/policy=true so xp-clean discovers this ConfigMap.
# Advanced selectors / mode:trace / notify / budgets: Concepts → Policy (Advanced).
apiVersion: v1
kind: ConfigMap
metadata:
  name: xp-clean-policy-team-a
  namespace: xp-clean
  labels:
    xp-clean.io/policy: "true"
    xp-clean.io/team: team-a
data:
  policy.yaml: |
    name: team-a
    dryRun: true
    selectors:
      requireLabels:
        xp-clean.io/eligible: "true"
    ttl:
      respectResourceTTL: true
      defaultTTL: 168h
    deletion:
      mode: roots
      scope: instances-only
