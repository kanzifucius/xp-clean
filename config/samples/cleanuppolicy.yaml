# Sample CleanupPolicy document (file form for --config override).
# In-cluster primary surface is labelled ConfigMaps in the dedicated xp-clean
# namespace — see configmap.yaml / configmap-team-b.yaml for multi-tenancy.
# British English docs; XR-only / v2-native — no claim support.
# Audit retention sinks are deferred (stdout JSON only).
name: test-stacks
schedule: "0 */6 * * *"
dryRun: true
timezone: Europe/London
selectors:
  # Labels and/or globs — either side may be empty.
  # Object must satisfy all non-empty constraint groups (AND).
  requireLabels:
    xp-clean.io/eligible: "true"
  globs:
    namespaces: ["team-*-dev", "xp-test-*"]
    xrdNames: ["*.dev.example.org"]
    xrNames: ["test-*", "ephemeral-*"]
    # First-cut GVK globs are group/version (kind not required).
    gvks: ["*.dev.example.org/*"]
  namespaceDeny: ["kube-system", "crossplane-system"]
ttl:
  respectResourceTTL: true
  defaultTTL: 168h
  applyDefaultTTLIfMissing: false
deletion:
  scope: instances-only # instances-only (default) | all
  maxTracesPerRun: 20
  maxDeletesPerRun: 100
  orphanMode: report
  deletePaused: false # skip paused resources by default
  allowXRDDeletion: false
  waitTimeout: 30m
observability:
  verbosity: normal
