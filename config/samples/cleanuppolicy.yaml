# Day-1 sample CleanupPolicy (file form for --config override).
# In-cluster primary surface is labelled ConfigMaps — see configmap.yaml.
# British English docs; XR-only / v2-native — no claim support.
#
# Essentials: label eligibility + TTL + dry-run + instances-only + roots mode.
# Live deletes: CLI --apply and dryRun: false. Deletes use foreground propagation.
# Waiting after delete is opt-in (deletion.wait / --wait).
# Advanced (mode: trace, scope: all, globs, notify, budgets): Concepts → Policy.
name: test-stacks
dryRun: true
selectors:
  requireLabels:
    xp-clean.io/eligible: "true"
ttl:
  respectResourceTTL: true
  defaultTTL: 168h
deletion:
  mode: roots
  scope: instances-only
  # wait: false   # default — set true (or pass --wait) to poll until gone
