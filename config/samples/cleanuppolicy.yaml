# MVP CleanupPolicy (file / ConfigMap substitute for the future CRD).
# British English docs; XR-only / v2-native — no claim support.
name: test-stacks
schedule: "0 */6 * * *"
dryRun: true
timezone: Europe/London
selectors:
  # Labels and/or globs — either side may be empty.
  # Object must satisfy all non-empty constraint groups (AND).
  requireLabels:
    xp-clean.io/eligible: "true"
  globs:
    namespaces: ["team-*-dev", "xp-test-*"]
    xrdNames: ["*.dev.example.org"]
    xrNames: ["test-*", "ephemeral-*"]
    gvks: ["*.dev.example.org/*"]
  namespaceDeny: ["kube-system", "crossplane-system"]
ttl:
  respectResourceTTL: true
  defaultTTL: 168h
  applyDefaultTTLIfMissing: false
deletion:
  scope: instances-only # instances-only (default) | all
  maxTracesPerRun: 20
  maxDeletesPerRun: 100
  orphanMode: report
  deletePaused: false
  allowXRDDeletion: false
  waitTimeout: 30m
observability:
  auditConfigMapNamespace: xp-clean
  verbosity: normal
  # Notifications are disabled until enabled: true. Webhook URLs stay in env/Secrets
  # (never inline here). Multi-sink schema; Teams Workflows is the MVP implementation.
  notifications:
    enabled: false
    notifyOn: [started, finished, failed]
    onDryRun: true
    onSuccessWithZeroDeletes: false
    onPartialErrors: true
    sinks:
      - type: teams
        webhookURLFromEnv: XP_CLEAN_TEAMS_WEBHOOK_URL
        # Optional log deep-link; {{runId}} is substituted per event.
        # logURLTemplate: "https://logs.example/search?q={{runId}}"
      # Phase 2:
      # - type: slack
      #   webhookURLFromEnv: XP_CLEAN_SLACK_WEBHOOK_URL

