# Second per-team policy ConfigMap (multi-tenancy / advanced glob example).
# Same xp-clean namespace; different selectors / TTL from team-a.
# Day-1 installs can ignore this sample — see Concepts → Policy (Advanced).
apiVersion: v1
kind: ConfigMap
metadata:
  name: xp-clean-policy-team-b
  namespace: xp-clean
  labels:
    xp-clean.io/policy: "true"
    xp-clean.io/team: team-b
data:
  policy.yaml: |
    name: team-b
    dryRun: true
    selectors:
      globs:
        namespaces: ["team-b-*"]
        xrdNames: ["*.team-b.example.org"]
        xrNames: ["ephemeral-*"]
        gvks: ["*.team-b.example.org/v1*"]
      namespaceDeny: ["kube-system", "crossplane-system"]
    ttl:
      respectResourceTTL: true
      defaultTTL: 72h
    deletion:
      mode: roots
      scope: instances-only
